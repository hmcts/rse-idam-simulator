plugins {
  id 'application'
  id 'checkstyle'
  id 'jacoco'
  id 'io.spring.dependency-management' version '1.1.7'
  id 'org.springframework.boot' version '4.1.2'
  id 'org.owasp.dependencycheck' version '13.0.0'
  id 'io.github.ben-manes.versions' version '0.67.0'
  id 'org.sonarqube' version '7.6.0.18749'
  id 'io.freefair.lombok' version '9.8.3'
}

group = 'uk.gov.hmcts.reform'
version = '0.0.1'

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(21)
  }
}

sourceSets {
  integrationTest {
    java {
      compileClasspath += main.output
      runtimeClasspath += main.output
    }
  }
}

configurations {
  integrationTestImplementation.extendsFrom testImplementation
  integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

tasks.register('integrationTest', Test) {
  testClassesDirs = sourceSets.integrationTest.output.classesDirs
  classpath = sourceSets.integrationTest.runtimeClasspath
  useJUnitPlatform()
}

tasks.named('check') {
  dependsOn(tasks.named('integrationTest'))
}

tasks.withType(JavaCompile).configureEach {
  options.compilerArgs << "-Xlint:unchecked" << "-Werror"
}

tasks.withType(Test).configureEach {
  useJUnitPlatform()

  testLogging {
    exceptionFormat = 'full'
  }
}

tasks.named('test') {
  failFast = true
}

tasks.register('integration', Test) {
  description = "Runs integration tests"
  group = "Verification"
  testClassesDirs = sourceSets.integrationTest.output.classesDirs
  classpath = sourceSets.integrationTest.runtimeClasspath
  failFast = true
}

checkstyle {
  maxWarnings = 0
  toolVersion = '14.4.0'
  getConfigDirectory().set(new File(rootDir, 'config/checkstyle'))
}

tasks.named('jacocoTestReport') {
  executionData(tasks.named('integration').get())
  reports {
    xml.required = true
    csv.required = false
    html.required = true
  }
}




// before committing a change, make sure task still works
tasks.named('dependencyUpdates') {
  def isNonStable = { String version ->
    def stableKeyword = ['RELEASE', 'FINAL', 'GA'].any { qualifier -> version.toUpperCase().contains(qualifier) }
    def regex = /^[0-9,.v-]+$/
    return !stableKeyword && !(version ==~ regex)
  }
  rejectVersionIf { selection -> // <---- notice how the closure argument is named
    return isNonStable(selection.candidate.version) && !isNonStable(selection.currentVersion)
  }
}

// https://jeremylong.github.io/DependencyCheck/dependency-check-gradle/configuration.html
dependencyCheck {
  // Specifies if the build should be failed if a CVSS score above a specified level is identified.
  // range of 0-10 fails the build, anything greater and it doesn't fail the build
  failBuildOnCVSS = System.getProperty('dependencyCheck.failBuild') == 'true' ? 0 : 11
  suppressionFile = 'config/owasp/suppressions.xml'

  analyzers {
    // Disable scanning of .NET related binaries
    assemblyEnabled = false
  }
}

repositories {
  mavenCentral()
  maven { url = 'https://jitpack.io' }
}

dependencyManagement {
  imports {
    mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2025.1.4'
  }
}

dependencies {
  implementation 'org.springframework.boot:spring-boot-starter-webmvc'
  implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

  implementation 'org.apache.logging.log4j:log4j-api:2.26.1'
  implementation 'org.apache.logging.log4j:log4j-to-slf4j:2.26.1'

  implementation 'com.nimbusds:nimbus-jose-jwt:10.10'
  implementation 'org.mapdb:mapdb:3.1.0'

  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
  testImplementation 'com.github.hmcts:idam-java-client:4.1.0-CCD-8220'

  testImplementation 'org.springframework.cloud:spring-cloud-contract-wiremock:5.0.3'

  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
  mainClass = 'uk.gov.hmcts.reform.rse.idam.simulator.Application'
}

tasks.named('bootJar') {
  getArchiveFileName().set(provider {
    'rse-idam-simulator.jar'
  })

  manifest {
    attributes('Implementation-Version': project.version.toString())
  }
}
