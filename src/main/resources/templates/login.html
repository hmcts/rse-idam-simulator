<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>  RSE Idam Simulator Login Form </title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #f3f2f1;
      color: #0b0c0c;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    .header {
      background: #0b0c0c;
      color: #fff;
      padding: 14px 24px;
      font-weight: 700;
      font-size: 1.1rem;
      border-bottom: 8px solid #1d70b8;
    }
    main {
      max-width: 720px;
      margin: 48px auto;
      padding: 0 16px;
    }
    h1 {
      font-size: 1.75rem;
      margin: 0 0 8px;
    }
    .hint {
      color: #505a5f;
      margin: 0 0 24px;
    }
    .container {
      background: #fff;
      padding: 24px;
      border-top: 4px solid #1d70b8;
    }
    label {
      display: block;
      font-weight: 700;
      margin-bottom: 6px;
    }
    input {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      margin-bottom: 20px;
      font-size: 1rem;
      border: 2px solid #0b0c0c;
    }
    input:focus {
      outline: 3px solid #ffdd00;
      outline-offset: 0;
    }
    button {
      background: #00703c;
      color: #fff;
      border: 0;
      box-shadow: 0 2px 0 #002d18;
      padding: 10px 18px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover {
      background: #005a30;
    }
    .accounts {
      margin-top: 32px;
    }
    .accounts h2 {
      font-size: 1.25rem;
      margin: 0 0 4px;
    }
    .accounts table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      font-size: 0.9rem;
    }
    .accounts th, .accounts td {
      text-align: left;
      padding: 8px;
      border-bottom: 1px solid #b1b4b6;
      vertical-align: top;
    }
    .accounts a {
      color: #1d70b8;
      word-break: break-all;
    }
    .roles {
      color: #505a5f;
    }
  </style>
</head>
<body>
<div class="header">HMCTS IDAM Simulator</div>
<main>
<center> <h1> RSE Idam Simulator Login Form </h1> </center>
<p class="hint">Sign in with a test account. This is a simulator: it only checks that the account exists.</p>
<form  action="#" th:action="${loginFormAction}" name="loginForm" method="post">
  <div class="container">
    <label for="username">Username : </label>
    <input type="text" placeholder="Enter Username" name="username" id="username" autocomplete="username">
    <label for="password">Password : </label>
    <input type="password" placeholder="Enter Password" name="password" id="password" autocomplete="current-password">
    <button type="submit" name="save">Sign in</button>
  </div>
</form>
<section class="accounts" th:if="${accounts != null and !accounts.isEmpty()}">
  <h2>Quick login</h2>
  <p class="hint">Select an account to sign in as that user.</p>
  <table>
    <tr><th>Email</th><th>Name</th><th>Roles</th></tr>
    <tr th:each="account : ${accounts}">
      <td><a href="#" class="account" th:attr="data-email=${account.email}" th:text="${account.email}">email</a></td>
      <td th:text="${account.forename + ' ' + account.surname}">name</td>
      <td class="roles" th:text="${account.roles == null ? '' : #strings.listJoin(account.roles, ', ')}">roles</td>
    </tr>
  </table>
</section>
<script>
  document.querySelectorAll('a.account').forEach(function (link) {
    link.addEventListener('click', function (event) {
      event.preventDefault();
      // The simulator only checks that the account exists, so the username alone signs in.
      document.getElementById('username').value = link.dataset.email;
      document.forms.loginForm.submit();
    });
  });
</script>
</main>
</body>
</html>
